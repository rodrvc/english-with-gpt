context: |
  Producto: English Practice — plataforma de práctica de inglés con 4 módulos
  (Speaking, Listening, Writing, Reading). Capa superior a un proyecto hermano
  que actúa como motor de aprendizaje/métricas longitudinales.

  Núcleo del producto: el estudiante recibe un problema, lo resuelve, la IA lo
  evalúa y el estudiante ITERA hasta alcanzar un nivel correcto. La corrección
  nunca se auto-aplica: el estudiante reescribe él mismo.

  Stack: frontend Vite + React + TypeScript; backend Express + TypeScript,
  desacoplados. El backend es la única frontera con OpenAI (la API key jamás
  llega al browser) y se diseña como API pública para permitir clientes
  externos y un futuro servidor MCP.

  Idioma: UI en español, contenido a practicar en inglés.
